 - title: "Bit-Precise Interpolation in Bitwuzla"
   id: tacas26-interpolation
   author:
   - Aina Niemetz
   - Mathias Preiner
   issued:
   year: 2026
   publication-title: TACAS
   volume:
   issue:
   pages: 66-88
   abstract: "Bitwuzla is a state-of-the-art SMT solver specialized in theories
     relevant to bit-precise reasoning. The main bit-vector solving
     procedure of Bitwuzla is based on bit-blasting, a reduction of
     bit-vector constraints to propositional logic (SAT). Until now,
     Bitwuzla did not support interpolant generation, which is a key
     requirement for many verification applications that rely on
     bit-precise reasoning. We present an extension of Bitwuzla with the
     capability to produce interpolants and interpolation sequences for
     quantifier-free bit-vector formulas. Our interpolation workflow
     extracts bit-level interpolants from proofs produced by the back-end
     SAT solver, which are lifted to the word-level and post-processed to
     recover and simplify word-level structure. We evaluate our new
     bit-vector interpolation engine in the context of various
     interpolation-based algorithms for symbolic model checking."
   pdf: https://link.springer.com/content/pdf/10.1007/978-3-032-22752-2_4.pdf
   doi: 10.1007/978-3-032-22752-2_4
   preprint:
   bibtex: https://dblp.org/rec/conf/tacas/NiemetzP26.html?view=bibtex
   artifact: https://zenodo.org/records/18331207
   talk:

 - title: "Massively Parallel Bit-Precise Verification with Bitwuzla and Mallob"
   id: tacas26-mallob
   author:
   - Dominik Schreiber
   - Aina Niemetz
   - Mathias Preiner
   issued:
   year: 2026
   publication-title: TACAS
   volume:
   issue:
   pages: 170-191
   abstract: "We present a distributed platform for massively parallel SMT solving
     that supports various theories for bit-precise reasoning, with and
     without quantifiers and push-pop incrementality. Our system is based
     on an integration of the state-of-the-art SMT solver Bitwuzla into the
     distributed job scheduling and automated reasoning platform Mallob,
     which allows Bitwuzla to make heavy use of Mallob's distributed
     incremental SAT solving engine. Our experimental evaluation shows that
     this approach outperforms prior SMT parallelization approaches and
     achieves unprecedented speedups at up to 768 cores."
   pdf: https://link.springer.com/content/pdf/10.1007/978-3-032-22752-2_9.pdf
   doi: 10.1007/978-3-032-22752-2_9
   preprint:
   bibtex: https://dblp.org/rec/conf/tacas/SchreiberNP26.html?view=bibtex
   artifact: https://zenodo.org/records/17478481
